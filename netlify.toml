[build]
  command = "NEXT_PUBLIC_API_URL=/api npm run build:netlify"
  publish = "frontend/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.api]
  node_bundler = "nft"
  external_node_modules = ["@prisma/client", "@nestjs/microservices", "@nestjs/websockets", "socket.io"]
  included_files = ["backend/node_modules/.prisma/client/*.node", "backend/dist/**", "backend/node_modules/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200


